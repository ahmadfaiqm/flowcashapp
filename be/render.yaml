services:
  - type: web
    name: flowcash-api
    env: node
    buildCommand: npm ci && npx prisma generate
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_EXPIRES_IN
        value: 1d
